; ******************************************************************************************
; SF OVHD — custom device for the A320 overhead panel mainboard
; Layout follows MobiFlight's CommunityTemplate.
; ******************************************************************************************

; Common build settings across this custom device
[env_SF_OVHD]
build_flags =
	${env.build_flags}								; include standard build flags
	-DMF_CUSTOMDEVICE_SUPPORT=1						; required for custom devices
	-DMF_CUSTOMDEVICE_HAS_UPDATE					; finishes the power cycle of the TLC5927 (D46)
	-DMF_CUSTOMDEVICE_POLL_MS=10
	;-DHAS_CONFIG_IN_FLASH							; config comes from the Connector, not from flash
	;-DDEBUG2CMDMESSENGER
	-DSSD1306_NO_SPLASH								; no Adafruit splash on SSD1306 displays
	-DSH110X_NO_SPLASH								; no Adafruit splash on SH1106 displays
	-I./src/src/MF_CustomDevice						; don't change this one!
	-I./SF_OVHD										; sources and fonts of the custom device
build_src_filter =
	+<../SF_OVHD>
lib_deps =
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit SH110X @ ^2.1.10
custom_core_firmware_version = 3.1.4				; core firmware this build is based on
custom_source_folder = SF_OVHD						; path to the custom device sources
custom_community_project = SF_OVHD					; folder name inside the ZIP
custom_zip_filename = ${env_SF_OVHD.custom_community_project}

; The mainboard carries a soldered ATmega2560, so this is the only target.
[env:SF_OVHD_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
	${env_SF_OVHD.build_flags}						; don't change this one!
	'-DMOBIFLIGHT_TYPE="SF OVHD Mega"'				; must match "MobiFlightType" in the board.json
	'-DMOBIFLIGHT_NAME="SF OVHD"'					; shown as Name in the settings dialog
	-DMEMLEN_CONFIG=1496							; max. size for the config stored in EEPROM
	-DMEMLEN_NAMES_BUFFER=1000						; max. size for configBuffer, input names only
	-DMF_MAX_DEVICEMEM=1600							; max. memory size for devices
; The panel has buttons, the TLC5927 LED drivers (output shifters), two PWM
; outputs (D44 backlight, D45 annunciators) and the three OLEDs, nothing else.
; Delete a line below to get that device family back.
build_unflags =
	-DMF_SEGMENT_SUPPORT
	-DMF_LCD_SUPPORT
	-DMF_STEPPER_SUPPORT
	-DMF_SERVO_SUPPORT
	-DMF_ANALOG_SUPPORT
	-DMF_INPUT_SHIFTER_SUPPORT
	-DMF_MUX_SUPPORT
	-DMF_DIGIN_MUX_SUPPORT
build_src_filter =
	${env.build_src_filter}							; don't change this one!
	${env_SF_OVHD.build_src_filter}					; don't change this one!
lib_deps =
	${env.lib_deps}									; don't change this one!
	${env.custom_lib_deps_Atmel}						; don't change this one!
	${env_SF_OVHD.lib_deps}							; don't change this one!
monitor_speed = 115200								; don't change this one!
extra_scripts =
	${env.extra_scripts}							; don't change this one!
custom_core_firmware_version = ${env_SF_OVHD.custom_core_firmware_version}
custom_community_project = ${env_SF_OVHD.custom_community_project}
custom_source_folder = ${env_SF_OVHD.custom_source_folder}
custom_zip_filename = ${env_SF_OVHD.custom_zip_filename}
